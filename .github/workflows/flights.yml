# Once a day: read N325CL's track for each new UTC day from adsb.lol's published daily archive
# (github.com/adsblol/globe_history_YYYY, out around 03:30 UTC) and add any completed flights to the log.
# Runs on GitHub's free runners (free for public repositories); commits the refreshed log once a day.
name: Flight log
on:
  schedule:
    - cron: '17 6 * * *'      # 23:17 PDT / 22:17 PST, after adsb.lol publishes the previous UTC day
  workflow_dispatch:
permissions:
  contents: write
concurrency: flight-log
jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 40         # each day is a ~4 GB stream; the first run catches up a week
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/flights.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Commit if changed
        run: |
          git diff --quiet N325CL/flights.json && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add N325CL/flights.json
          git commit -m "Flight log: update"
          git push
